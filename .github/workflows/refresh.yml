name: Daily Refresh — parcels, signals, leads

# Daily at 11:00 UTC = 4:00am Phoenix (MST year-round, Arizona has no DST).
# The parcel jsonls are gitignored, so the runner gets them from a weekly
# actions/cache entry; on cache miss (first run of each ISO week) it pulls the
# full parcel masters from the public ArcGIS endpoints — that pull takes
# multiple hours (~1.6M Maricopa parcels at ~1K/page), hence the long
# timeouts. Cache-hit days finish in ~10 minutes.
#
# Recorder signals come from the Maricopa Recorder REST API (no browser).
# The Playwright portal scrapers (maricopa_recorder.py / pima_recorder.py) are
# NOT run here: the Pima recorder portal sits behind the Tyler WAF and blocks
# GitHub Actions runners. Recorder steps are fail-soft — a signal outage must
# never block the daily rotation refresh.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Recorder signal window (days)"
        required: false
        default: "30"
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute parcel-cache week key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore weekly parcel master cache
        id: cache-parcels
        uses: actions/cache@v4
        with:
          path: |
            data/maricopa_parcels.jsonl
            data/pima_parcels.jsonl
          # v3: adds DEED_NUMBER to the Maricopa parcel schema (deed#->APN direct
          #     join). Bumping the key forces a one-time re-pull with the new
          #     field — no manual step; subsequent weeks restore from cache.
          key: parcels-v3-${{ steps.week.outputs.week }}

      - name: Pull Maricopa parcel master (ArcGIS)
        if: steps.cache-parcels.outputs.cache-hit != 'true'
        timeout-minutes: 240
        run: PYTHONPATH=. python scrapers/maricopa_parcels.py

      - name: Pull Pima parcel master (ArcGIS)
        if: steps.cache-parcels.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: PYTHONPATH=. python scrapers/pima_parcels.py

      - name: Compute rolling doc-store cache key
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore cumulative document stores (rolling daily)
        # doc stores are gitignored + regenerable, but the incremental/retention
        # model (esp. CQ/TD matching an NS recorded weeks earlier) needs them to
        # persist across runs. Date-keyed with a prefix restore-key = "load the
        # most recent prior store, merge today's scrape, save under today's key".
        uses: actions/cache@v4
        with:
          path: |
            data/maricopa_recorder_docs.jsonl
            data/pima_recorder_docs.jsonl
            data/pima_tax_docs.jsonl
          key: docstores-${{ steps.day.outputs.day }}
          restore-keys: docstores-

      - name: Maricopa recorder documents (REST API, fail-soft)
        continue-on-error: true
        run: PYTHONPATH=. python scrapers/maricopa_recorder_api.py --days "${{ github.event.inputs.days || '30' }}"

      - name: Pima deed transfers (GIS layer 12, fail-soft)
        continue-on-error: true
        run: PYTHONPATH=. python scrapers/pima_deeds.py --days 90

      - name: Pima treasurer delinquency (feed-ready; no-op if file absent)
        continue-on-error: true
        run: PYTHONPATH=. python pipeline/enrich_treasurer.py

      - name: Build leads.json (doc-type leads, UCIF v5.5.0)
        run: PYTHONPATH=. python -m pipeline.build_docleads

      - name: Sanity check — refuse to commit a gutted dashboard
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("data/leads.json"))
          total = d.get("total_leads", 0)
          counts = d.get("doc_type_counts", {})
          types = sum(len(v) for v in counts.values())
          print(f"total_leads={total}  doc_types={types}  "
                f"resolved={d.get('resolved')}  range={d.get('date_range')}")
          # doc-type leads are far fewer than the old score pool; guard against
          # a total wipeout (both document stores empty) rather than a size floor
          if total < 500 or types < 3:
              sys.exit("document pool suspiciously small — a scraper likely failed; refusing to commit")
          EOF

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # cumulative doc stores are gitignored (regenerable); only leads.json ships
          git add data/leads.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
