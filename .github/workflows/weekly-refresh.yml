name: Weekly Refresh — Maricopa Recorder Signals

# SCHEDULE DISABLED — superseded by refresh.yml (daily full refresh).
# WARNING: this job runs build_leads.py WITHOUT pulling the parcel masters
# (data/*.jsonl are gitignored, so the runner has none). That produces an
# empty lead pool and would overwrite the live dashboard if committed.
# Do not re-enable the cron without adding parcel pulls + a sanity guard.
on:
  workflow_dispatch:   # manual triggering only

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Maricopa Recorder (last 30 days, all distress codes)
        run: PYTHONPATH=. python scrapers/maricopa_recorder_api.py --days 30

      - name: Match recorder names → parcel APNs
        run: PYTHONPATH=. python pipeline/match_recorder.py

      - name: Rebuild leads.json with fresh signals
        run: PYTHONPATH=. python pipeline/build_leads.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.json data/maricopa_recorder_raw.jsonl data/maricopa_recorder_unresolved.jsonl
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly refresh: recorder signals $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: data/_debug/
          retention-days: 14
