name: Weekly Refresh — Maricopa Recorder Signals

# Sunday 3am CST = Sunday 09:00 UTC (during CST, Nov–Mar).
# During CDT (Mar–Nov) it'll run at 2am local. Close enough to 3am ±1hr
# and not worth the complexity of a DST-aware schedule.
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:   # allow manual triggering

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape Maricopa Recorder (last 30 days, all distress codes)
        run: PYTHONPATH=. python scrapers/maricopa_recorder_api.py --days 30

      - name: Match recorder names → parcel APNs
        run: PYTHONPATH=. python pipeline/match_recorder.py

      - name: Rebuild leads.json with fresh signals
        run: PYTHONPATH=. python pipeline/build_leads.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.json data/maricopa_recorder_raw.jsonl data/maricopa_recorder_unresolved.jsonl
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly refresh: recorder signals $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: data/_debug/
          retention-days: 14
