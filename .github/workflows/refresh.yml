name: Daily Refresh — parcels, signals, leads

# Daily at 11:00 UTC = 4:00am Phoenix (MST year-round, Arizona has no DST).
# The parcel jsonls are gitignored, so the runner gets them from a weekly
# actions/cache entry; on cache miss (first run of each ISO week) it pulls the
# full parcel masters from the public ArcGIS endpoints — that pull takes
# multiple hours (~1.6M Maricopa parcels at ~1K/page), hence the long
# timeouts. Cache-hit days finish in ~10 minutes.
#
# Recorder signals come from the Maricopa Recorder REST API (no browser).
# The Playwright portal scrapers (maricopa_recorder.py / pima_recorder.py) are
# NOT run here: the Pima recorder portal sits behind the Tyler WAF and blocks
# GitHub Actions runners. Recorder steps are fail-soft — a signal outage must
# never block the daily rotation refresh.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Recorder signal window (days)"
        required: false
        default: "30"
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute parcel-cache week key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore weekly parcel master cache
        id: cache-parcels
        uses: actions/cache@v4
        with:
          path: |
            data/maricopa_parcels.jsonl
            data/pima_parcels.jsonl
          # v2: v1 entries hold a geometry-only Pima pull (lines layer) — unusable
          key: parcels-v2-${{ steps.week.outputs.week }}

      - name: Pull Maricopa parcel master (ArcGIS)
        if: steps.cache-parcels.outputs.cache-hit != 'true'
        timeout-minutes: 240
        run: PYTHONPATH=. python scrapers/maricopa_parcels.py

      - name: Pull Pima parcel master (ArcGIS)
        if: steps.cache-parcels.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: PYTHONPATH=. python scrapers/pima_parcels.py

      - name: Maricopa recorder signals (REST API, fail-soft)
        continue-on-error: true
        run: PYTHONPATH=. python scrapers/maricopa_recorder_api.py --days "${{ github.event.inputs.days || '30' }}"

      - name: Match recorder names to parcel APNs (fail-soft)
        continue-on-error: true
        run: |
          if [ -f data/maricopa_recorder_raw.jsonl ]; then
            PYTHONPATH=. python pipeline/match_recorder.py
          else
            echo "no recorder raw file — skipping match step"
          fi

      - name: Build leads.json (scoring, tiers, daily rotation)
        run: PYTHONPATH=. python pipeline/build_leads.py

      - name: Sanity check — refuse to commit a gutted dashboard
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("data/leads.json"))
          total = d.get("total_leads", 0)
          shipped = len(d.get("leads", []))
          print(f"total_leads={total}  shipped={shipped}  rotation={d.get('daily_rotation_size')}")
          if total < 100_000 or shipped < 10_000:
              sys.exit("lead pool suspiciously small — parcel pull likely failed; refusing to commit")
          EOF

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.json data/_rotation_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
